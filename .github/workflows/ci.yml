name: CI

# Kept small on purpose: a private repository has a monthly allowance of Actions minutes, and each
# job is billed rounded up to the minute. So: one machine for everything (no second npm ci, browser
# install and build per shard), only for pull requests (a merge to main was tested in its PR), and
# none for documentation-only changes. Run it by hand from the Actions tab when needed.
on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # A draft is still being worked on: checked once it is marked ready.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:ext
      # Key-shaped strings in tracked files, and known-vulnerable dependencies the app ships (a minute).
      - run: npm run security
      - run: npm run lint
      - run: npm test
      - run: npx vite build
        env:
          VITE_ALLOW_GUEST: '1'
      # Flows and screenshots in a real browser (phone, iPhone on WebKit, desktop). Screenshot baselines are made
      # on this same runner by snapshots.yml. The browser is cached between runs; its system
      # libraries are installed each time (they are not kept between machines).
      - id: pw
        run: echo "version=$(npx playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-webkit
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit
      - run: npx playwright test
      # The sign-in gate needs a build with Supabase set up (a fake address; the tests stub every request).
      - run: npm run test:e2e:gate
      - uses: actions/upload-artifact@v4
        if: failure() || cancelled()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
