name: CI

# Run WebKit separately so its slower mobile checks fit within the job timeout.
# Keep checks together on the Chromium runner; skip documentation-only changes and main pushes.
on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # A draft is still being worked on: checked once it is marked ready.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:ext
      # Key-shaped strings in tracked files, and known-vulnerable dependencies the app ships (a minute).
      - run: npm run security
      - run: npm run lint
      - run: npm test
      - run: npx vite build
        env:
          VITE_ALLOW_GUEST: '1'
      # Flows and screenshots in a real browser (phone and desktop). Screenshot baselines are made
      # on this same runner by snapshots.yml. The browser is cached between runs; its system
      # libraries are installed each time (they are not kept between machines).
      - id: pw
        run: echo "version=$(npx playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npx playwright test --project=phone --project=desktop
      # The sign-in gate needs a build with Supabase set up (a fake address; the tests stub every request).
      - run: npm run test:e2e:gate
      - uses: actions/upload-artifact@v4
        if: failure() || cancelled()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  webkit:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      WEBKIT_SMOKE: 'first run:|auth screen and onboarding|text stays readable|Progress starts|profile can be dressed|hard words glow|garden card on Today|badges on show'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vite build
        env:
          VITE_ALLOW_GUEST: '1'
      - id: pw
        run: echo "version=$(npx playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-webkit
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps webkit
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps webkit
      # Known sensitive flows run first to provide useful failure reports without waiting for the full suite.
      - run: npx playwright test --project='iPhone (WebKit)' --workers=2 --grep "$WEBKIT_SMOKE" --max-failures=1
      - run: npx playwright test --project='iPhone (WebKit)' --workers=2 --grep-invert "$WEBKIT_SMOKE"
      - uses: actions/upload-artifact@v4
        if: failure() || cancelled()
        with:
          name: playwright-webkit-report
          path: |
            playwright-report
            test-results
          retention-days: 7
