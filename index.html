    <script>
      // Theme before the first paint (light unless chosen otherwise), so a dark system shows no dark flash.
      try {
        var t = localStorage.getItem('kelime-koc:theme') || 'light'
        if (t !== 'system') document.documentElement.dataset.theme = t === 'calm' ? 'dark' : t === 'contrast' ? 'light' : t
        if (t === 'calm') document.documentElement.dataset.calm = ''
        if (t === 'contrast') document.documentElement.dataset.contrast = ''
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
    <script>
      // The light of the hour before the first paint (same hours as the garden sky; the app keeps it current).
      var h = new Date().getHours() + new Date().getMinutes() / 60
      document.documentElement.dataset.daypart = h >= 5.5 && h < 8 ? 'dawn' : h >= 8 && h < 17 ? 'day' : h >= 17 && h < 20.5 ? 'dusk' : 'night'
    </script>

    <style>
      /* Shown from the HTML alone while the app's code downloads; React replaces it on its first render. */
      .boot { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 0.75rem; background: #f1f5f9; color: #475569; font: 600 1.125rem/1.2 system-ui, -apple-system, 'Segoe UI', sans-serif; letter-spacing: -0.01em; }
      .boot svg { width: 3.5rem; height: 3.5rem; filter: drop-shadow(0 2px 8px rgb(49 46 129 / 0.35)); }
      [data-theme='dark'] .boot { background: #0f172a; color: #cbd5e1; }
      [data-calm] .boot { background: #15171c; color: #a3a1a8; }
      [data-contrast] .boot { background: #ffffff; color: #000000; }
      @media (prefers-color-scheme: dark) { :root:not([data-theme]) .boot { background: #0f172a; color: #cbd5e1; } }
    </style>
