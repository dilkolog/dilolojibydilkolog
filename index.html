<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet" />
    <title>Diloloji</title>
    <meta name="theme-color" content="#f1f5f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <script>
      // Theme before the first paint (light unless chosen otherwise), so a dark system shows no dark flash.
      try {
        var t = localStorage.getItem('kelime-koc:theme') || 'light'
        if (t !== 'system') document.documentElement.dataset.theme = t === 'calm' ? 'dark' : t === 'contrast' ? 'light' : t
        if (t === 'calm') document.documentElement.dataset.calm = ''
        if (t === 'contrast') document.documentElement.dataset.contrast = ''
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
    <script>
      // The light of the hour before the first paint (same hours as the garden sky; the app keeps it current).
      var h = new Date().getHours() + new Date().getMinutes() / 60
      document.documentElement.dataset.daypart = h >= 5.5 && h < 8 ? 'dawn' : h >= 8 && h < 17 ? 'day' : h >= 17 && h < 20.5 ? 'dusk' : 'night'
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Diloloji" />
    <meta name="format-detection" content="telephone=no" />
    <style>
      /* Shown from the HTML alone while the app's code downloads; React replaces it on its first render. */
      .boot { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 0.75rem; background: #f1f5f9; color: #475569; font: 600 1.125rem/1.2 system-ui, -apple-system, 'Segoe UI', sans-serif; letter-spacing: -0.01em; }
      .boot svg { width: 3.5rem; height: 3.5rem; filter: drop-shadow(0 2px 8px rgb(49 46 129 / 0.35)); }
      [data-theme='dark'] .boot { background: #0f172a; color: #cbd5e1; }
      [data-calm] .boot { background: #15171c; color: #a3a1a8; }
      [data-contrast] .boot { background: #ffffff; color: #000000; }
      @media (prefers-color-scheme: dark) { :root:not([data-theme]) .boot { background: #0f172a; color: #cbd5e1; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" aria-hidden="true">
        <svg viewBox="0 0 512 512"><defs><linearGradient id="boot-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366f1" /><stop offset="1" stop-color="#312e81" /></linearGradient><linearGradient id="boot-leaf" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#10b981" /><stop offset="1" stop-color="#6ee7b7" /></linearGradient></defs><rect width="512" height="512" rx="116" fill="url(#boot-bg)" /><g transform="translate(256 256) scale(0.92) translate(-265 -282)"><path d="M144 108H258C362 108 420 176 420 250C420 324 362 392 258 392H222L140 456C132 462 124 456 126 447L138 392H144A34 34 0 0 1 110 358V142A34 34 0 0 1 144 108Z" fill="#fff" /><path d="M176 336C172 240 224 176 332 168C340 266 288 332 176 336Z" fill="url(#boot-leaf)" /><path d="M194 322C232 276 272 232 312 192" stroke="#fff" stroke-width="12" stroke-linecap="round" fill="none" opacity=".8" /></g></svg>
        Diloloji
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
