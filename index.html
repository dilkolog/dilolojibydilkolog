    <script>
      // Theme before the first paint (light unless chosen otherwise), so a dark system shows no dark flash.
      try {
        var t = localStorage.getItem('kelime-koc:theme') || 'light'
        if (t !== 'system') document.documentElement.dataset.theme = t === 'calm' ? 'dark' : t === 'contrast' ? 'light' : t
        if (t === 'calm') document.documentElement.dataset.calm = ''
        if (t === 'contrast') document.documentElement.dataset.contrast = ''
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
      // Someone not signed in sees the landing page's first lines at once (#boot-hero), in the language its address names.
      try {
        if (!localStorage.getItem('diloloji-auth')) {
          var p = location.pathname.replace(/^\/+|\/+$|\.html$/g, '')
          document.documentElement.dataset.visitor = p === 'ispanyolca' ? 'es' : p === 'ingilizce' ? 'en' : 'fr'
        }
      } catch (e) {}
    </script>
    <script>
      // The light of the hour before the first paint (same hours as the garden sky; the app keeps it current).
      var h = new Date().getHours() + new Date().getMinutes() / 60
      document.documentElement.dataset.daypart = h >= 5.5 && h < 8 ? 'dawn' : h >= 8 && h < 17 ? 'day' : h >= 17 && h < 20.5 ? 'dusk' : 'night'
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <style>
      /* Shown from the HTML alone while the app's code downloads; React replaces it on its first render. */
      .boot { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 0.75rem; background: #f1f5f9; color: #475569; font: 600 1.125rem/1.2 system-ui, -apple-system, 'Segoe UI', sans-serif; letter-spacing: -0.01em; }
      .boot svg { width: 3.5rem; height: 3.5rem; filter: drop-shadow(0 2px 8px rgb(49 46 129 / 0.35)); }
      [data-theme='dark'] .boot { background: #0f172a; color: #cbd5e1; }
      [data-calm] .boot { background: #15171c; color: #a3a1a8; }
      [data-contrast] .boot { background: #ffffff; color: #000000; }
      @media (prefers-color-scheme: dark) { :root:not([data-theme]) .boot { background: #0f172a; color: #cbd5e1; } }
      /* The landing page's first lines from the HTML alone, for a visitor (data-visitor): the page itself replaces them (Landing.tsx). */
      @font-face { font-family: 'Lexend'; font-weight: 400; font-display: swap; src: url(/fonts/lexend-latin-400-normal.woff2) format('woff2'); }
      @font-face { font-family: 'Lexend'; font-weight: 700; font-display: swap; src: url(/fonts/lexend-latin-700-normal.woff2) format('woff2'); }
      @font-face { font-family: 'Lexend'; font-weight: 400; font-display: swap; src: url(/fonts/lexend-latin-ext-400-normal.woff2) format('woff2'); unicode-range: U+0100-024F; }
      @font-face { font-family: 'Lexend'; font-weight: 700; font-display: swap; src: url(/fonts/lexend-latin-ext-700-normal.woff2) format('woff2'); unicode-range: U+0100-024F; }
      #boot-hero { display: none; }
      [data-visitor] .boot { display: none; }
      [data-visitor] #boot-hero { --accent: #9a2f62; --dot: #c6317c; display: block; position: fixed; inset: 0; z-index: 1; overflow: hidden; background: color-mix(in srgb, var(--dot) 3%, #f1f5f9); color: #0f172a; font-family: 'Lexend', system-ui, sans-serif; }
      [data-visitor='es'] #boot-hero { --accent: #844b00; --dot: #e6a313; }
      [data-visitor='en'] #boot-hero { --accent: #2b58b1; --dot: #2f6de6; }
      [data-theme='dark'] #boot-hero { background: #0b1120; color: #f1f5f9; --accent: #fda4af; }
      [data-theme='dark'][data-visitor='es'] #boot-hero { --accent: #fde68a; }
      [data-theme='dark'][data-visitor='en'] #boot-hero { --accent: #93c5fd; }
      #boot-hero .bh-top, #boot-hero .bh-main { max-width: 68rem; margin: 0 auto; padding-inline: 1rem; }
      #boot-hero .bh-top { display: flex; align-items: center; gap: 0.625rem; padding-block: 0.875rem; font-size: 1.5rem; font-weight: 700; }
      #boot-hero .bh-top img { width: 2rem; height: 2rem; border-radius: 0.5rem; }
      #boot-hero .bh-main { display: grid; padding-block: 2rem 1rem; }
      #boot-hero .bh-pill { justify-self: start; display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.375rem 0.875rem; border-radius: 999px; background: #fff; color: var(--accent); font-size: 0.75rem; font-weight: 600; margin-bottom: 0.75rem; }
      [data-theme='dark'] #boot-hero .bh-pill { background: #1e293b; }
      #boot-hero .bh-pill::before { content: ''; width: 0.5rem; height: 0.5rem; border-radius: 50%; background: var(--dot); }
      #boot-hero h1 { margin: 0.25rem 0 1rem; font-size: clamp(2rem, 4.6vw, 3rem); line-height: 1.1; font-weight: 700; letter-spacing: -0.015em; text-wrap: balance; }
      #boot-hero h1 span { color: var(--accent); }
      #boot-hero p { margin: 0; max-width: 36rem; font-size: 1.125rem; line-height: 1.55; color: #57677e; }
      [data-theme='dark'] #boot-hero p { color: #94a3b8; }
      @media (min-width: 46rem) { #boot-hero .bh-main { grid-template-columns: 1.2fr 1fr; padding-block: 3rem 1.5rem; } }
    </style>

  <body>
    <div id="boot-hero" aria-hidden="true">
      <div class="bh-top"><img src="/favicon.svg" alt="" width="32" height="32" />Diloloji</div>
      <div class="bh-main">
        <div>

          <h1>Fransızca, İspanyolca, İngilizce. <span>Türkçe anlatımla, A1’den C1’e.</span></h1>
          <p>Kelime, dilbilgisi, okuma, dinleme ve konuşma tek bir yolda. Her kural Türkçe anlatılır, tekrarlar senin hafızana göre ayarlanır. Günde birkaç dakika yeter.</p>
