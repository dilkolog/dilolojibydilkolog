<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Diloloji · Ses durum panosu</title><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="style.css"><script src="icons.js"></script><script src="states.js"></script><body data-lang="es"><header><a class="brand" href="index.html">◈ Diloloji <small>Kayıt ve ses durumları</small></a><a href="index.html">Etkileşimli önizleme ↗</a></header><main><span class="eyebrow">ORTAK ANATOMİ · AYRI İŞLEMLER</span><h1>Her durumda ne olacağı açık.</h1><p class="muted" style="margin-bottom:30px">15 durum görünümü. Gerçek mikrofon, puanlama veya kullanıcı verisi yok.</p><div id="board" class="board-grid"></div></main><footer>Kelime kaydı 8 sn · Telaffuz 12 sn · Gölgeleme metne göre, en fazla 15 sn · Claude devir notları pakette.</footer><script>const icons=id=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[id]||ICONS.speaking}</svg>`;document.querySelector('#board').innerHTML=Object.entries(VOICE_STATES).map(([id,s],i)=>`<article class="card board-card"><span class="chip">${String(i+1).padStart(2,'0')} · ${s.name}</span><p class="word" lang="es">Me gustaría hablar español.</p><div class="status-panel ${id==='recording'?'is-recording':''}"><span class="mic-orb">${icons(s.icon)}</span><h3>${s.title}</h3><p>${s.text}</p>${id==='recording'?'<div class="record-clock"><span class="rec-dot"></span><b>00:04</b><small>/12sn</small></div>':''}${['audioloading','checking'].includes(id)?'<div class="spinner"></div>':''}</div><p class="small" style="margin-top:15px">${['success','needspractice'].includes(id)?'Puan yalnız gerçek servis yanıtından gelmeli.':id==='saved'?'Kelime kaydı · puan yok':id==='hearing'?'Gölgeleme · önce dinleme':'Duruma göre ana eylem ve çıkış yolu önizlemede.'}</p></article>`).join('');</script></body></html>
